<section class="page"><h2>{{esEdicion()?'Editar categoría':'Nueva categoría'}}</h2>@if(error()){<div class="alerta">{{error()}}</div>}<form [formGroup]="form" (ngSubmit)="guardar()" class="card formulario"><label>Nombre<input class="input" formControlName="nombre"></label><label>Descripción<textarea class="input" rows="3" formControlName="descripcion"></textarea></label><label class="check"><input type="checkbox" formControlName="estado"> Activo</label><div class="acciones"><a routerLink="/categorias" class="btn">Cancelar</a><button class="btn btn-primary">Guardar</button></div></form></section>

<section class="page">
  <h2>{{ esEdicion() ? 'Editar cliente' : 'Nuevo cliente' }}</h2>
  @if (error()) { <div class="alerta">{{ error() }}</div> }
  <form [formGroup]="form" (ngSubmit)="guardar()" class="card formulario">
    <label>DNI <input class="input" formControlName="dni" maxlength="8" />
      @if (form.controls.dni.touched && form.controls.dni.invalid) { <small class="error">Debe contener exactamente 8 dígitos.</small> }
    </label>
    <label>Nombres <input class="input" formControlName="nombres" />
      @if (form.controls.nombres.touched && form.controls.nombres.invalid) { <small class="error">Obligatorio, entre 2 y 100 caracteres.</small> }
    </label>
    <label>Apellidos <input class="input" formControlName="apellidos" />
      @if (form.controls.apellidos.touched && form.controls.apellidos.invalid) { <small class="error">Obligatorio, entre 2 y 100 caracteres.</small> }
    </label>
    <label>Correo <input class="input" type="email" formControlName="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) { <small class="error">Ingrese un correo válido.</small> }
    </label>
    <label>Teléfono <input class="input" formControlName="telefono" maxlength="9" placeholder="Opcional" />
      @if (form.controls.telefono.touched && form.controls.telefono.invalid) { <small class="error">Debe contener 9 dígitos.</small> }
    </label>
    <label>Dirección <textarea class="input" rows="3" formControlName="direccion" placeholder="Opcional"></textarea></label>
    <label class="check"><input type="checkbox" formControlName="estado" /> Activo</label>
    <div class="acciones">
      <a routerLink="/clientes" class="btn">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="guardando()">{{ guardando() ? 'Guardando…' : (esEdicion() ? 'Actualizar' : 'Registrar') }}</button>
    </div>
  </form>
</section>
